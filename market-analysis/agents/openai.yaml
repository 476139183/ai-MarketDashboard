interface:
  display_name: "多市场资产分析（A股/美股/加密）"
  short_description: "先识别 A股或美股，再给做多/做空/观望 + E/S/T1"
  default_prompt: "使用 $market-analysis。先判定市场（A股 / 美股 / 加密）并只套对应规则与数据源，禁止混用。时间用北京时间。盘中信号：美股可做多/做空/观望；A股普通现货默认做多/观望（做空仅融券等已标明时）。止损 S 必须是关键点位，顺序 S→E→T1；5x 满仓仅作压测（|E−S|/E<7% 且 ≤0.5×ATR），过宽则观望不改假 S。同屏给 E、S、T1、R1、5x%。A股须处理涨跌停与 T+1；美股须处理盘前盘后与 RTH ORB。"
