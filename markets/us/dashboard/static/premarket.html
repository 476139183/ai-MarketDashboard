<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>闪迪盘前观察</title>
<style>
:root{color-scheme:light;--ink:#17232e;--muted:#667581;--line:#dbe4e8;--accent:#127c6e;--bg:#f2f6f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:36px 22px 64px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.12em}h1{margin:4px 0;font-size:32px;letter-spacing:-.04em}p{margin:0}.sub{color:var(--muted)}.pill{background:#e4f2ee;color:#126a5f;border-radius:999px;padding:8px 13px;font-weight:700}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:24px}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 24px #1b3f3810}.label{font-size:13px;color:var(--muted)}.price{font-size:48px;letter-spacing:-.045em;font-weight:700;line-height:1.15;margin:8px 0}.price small{font-size:16px;color:var(--muted);letter-spacing:0}.meta{font-size:13px;color:var(--muted);margin-top:8px}.signal{font-size:28px;font-weight:700;margin:10px 0}.reason{color:#53616a;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{background:#f7faf9;border-radius:12px;padding:14px}.value{font-size:19px;font-weight:650;margin-top:5px}.foot{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.7}.warn{background:#fff3df;color:#7c5718;border:1px solid #f1d4a4;border-radius:10px;padding:10px 12px;margin-top:15px;font-size:13px}button{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 12px;color:var(--ink);cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.price{font-size:40px}.wrap{padding-top:22px}}
</style>
</head>
<body><div class="wrap">
<header><div><div class="eyebrow">MARKET WATCH · NASDAQ</div><h1>闪迪盘前观察</h1><p class="sub">SNDK · 每 15 分钟整点分析</p></div><div><span class="pill" id="phase">等待数据</span> <button id="refresh">刷新显示</button></div></header>
<div class="layout"><section class="box"><div class="label">最近成交价 · 美元</div><div class="price"><span id="price">—</span> <small>USD</small></div><p class="meta" id="quote-time">等待行情</p><div class="grid"><div class="stat"><div class="label">昨收参考</div><div class="value" id="previous">—</div></div><div class="stat"><div class="label">采样高</div><div class="value" id="high">—</div></div><div class="stat"><div class="label">采样低</div><div class="value" id="low">—</div></div></div><p class="foot" id="sample">采样范围不等于真实盘前高低点。</p></section>
<section class="box"><div class="label">当前判断</div><div class="signal" id="signal">观望</div><p class="reason" id="reason">等待定时分析。</p><div class="grid"><div class="stat"><div class="label">15 分钟采样趋势</div><div class="value" id="trend">—</div></div><div class="stat"><div class="label">下次检查</div><div class="value" id="next">—</div></div></div><p class="warn">采样行情缺少可靠成交量，暂不能计算可信 VWAP，也不能确认做多、做空或止损价。</p></section></div>
<p class="foot" id="updated">页面每 15 秒读取最新结果；行情分析由本机脚本每 15 分钟运行。脚本或服务停止时不再更新。</p>
</div>
<script>
const el=id=>document.getElementById(id);const money=x=>x==null?'—':Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function nextQuarter(){const d=new Date();const n=new Date(Math.floor(d.getTime()/900000)*900000+900000);return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(n)}
async function load(){try{const r=await fetch('/api/premarket?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();el('phase').textContent=x.available?(x.phase||'未知'):'等待数据';el('price').textContent=money(x.current_price);el('quote-time').textContent=x.quote_fresh?'Nasdaq 成交时间（美东）：'+x.quote_time_et:'行情过期或不可用';el('previous').textContent=money(x.previous_close_reference);el('high').textContent=money(x.sample_high);el('low').textContent=money(x.sample_low);el('sample').textContent='价格采样 '+(x.sample_count??0)+' 点 · 最后采样 '+(x.sample_last_bj||'—')+'；可能遗漏真实极值。';el('signal').textContent=x.signal||'观望';el('reason').textContent=x.reason||'等待定时分析。';el('trend').textContent=x.trend_15m_sample||'数据不足';el('next').textContent=nextQuarter();el('updated').textContent='分析时间：'+(x.generated_bj||'—')+(x.report_fresh?'':' · 结果可能过期')+'。页面每 15 秒读取本机结果。';}catch(e){el('phase').textContent='连接失败';el('price').textContent='—';el('signal').textContent='观望';el('reason').textContent='无法读取本地结果，请检查服务。';}}
el('refresh').addEventListener('click',load);load();setInterval(load,15000);
</script></body></html>
