<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美股盘前观察</title>
<style>
:root{--ink:#182632;--muted:#687c8c;--line:#dae4e7;--green:#147e6f}*{box-sizing:border-box}body{margin:0;background:#f1f6f4;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:36px 24px 64px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.12em}h1{margin:3px 0;font-size:32px;letter-spacing:-.04em}header p{margin:0;color:var(--muted);font-size:14px}.tag{background:#e0f1ec;color:#176c60;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;color:#536877;cursor:pointer}fieldset{border:0;padding:0;margin:24px 0 18px;display:flex;flex-wrap:wrap;gap:8px}label{border:1px solid #dce6e2;background:#fff;border-radius:20px;padding:7px 13px;cursor:pointer;color:#60736e;font-size:14px}label:has(input:checked){background:#176f61;border-color:#176f61;color:#fff}input{position:absolute;opacity:0}input:focus-visible+span{outline:2px solid #6ba89b;outline-offset:3px}.stock{margin-bottom:18px}.stock-title{font-size:17px;font-weight:700;margin:0 0 8px}.stock-title span{color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 7px 24px #173e3310}.small{color:var(--muted);font-size:13px}.price{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.2;margin:5px 0}.price small{font-size:14px;color:var(--muted);letter-spacing:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#f5f8f7;border-radius:11px;padding:11px 13px}.stat strong{display:block;margin-top:4px;font-size:17px}.signal{font-size:26px;font-weight:700;margin:5px 0}.trend{color:#426a5d;font-weight:600;margin-top:10px}.note{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.6}.foot{margin-top:16px;color:var(--muted);font-size:13px}@media(max-width:700px){.wrap{padding:24px 15px}.layout{grid-template-columns:1fr}.box{padding:18px}.price{font-size:34px}.stock{margin-bottom:24px}}
</style></head><body><div class="wrap">
<header><div><div class="eyebrow">MARKET WATCH · NASDAQ</div><h1>美股盘前观察</h1><p>行情约 30 秒更新 · 结构每 15 分钟分析</p></div><div><span class="tag" id="status">等待更新</span> <button id="refresh">刷新</button></div></header>
<fieldset id="symbols" aria-label="选择股票"></fieldset><main id="cards" aria-live="polite"></main><p class="foot" id="updated">等待首次分析。</p>
</div><script>
const catalog=[['SNDK','闪迪'],['SKHY','海力士'],['MU','美光'],['NVDA','英伟达']];const $=id=>document.getElementById(id);let saved;try{saved=JSON.parse(localStorage.getItem('market-watch-selected')||'null')}catch{}let chosen=new Set(Array.isArray(saved)?saved:['SNDK','SKHY','MU','NVDA']);let latest=null;const money=x=>x==null?'—':Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const time=x=>x?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(x)):'—';
function drawChoices(){const area=$('symbols');area.replaceChildren();for(const [sym,name] of catalog){let label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.checked=chosen.has(sym);span.textContent=name;input.onchange=()=>{input.checked?chosen.add(sym):chosen.delete(sym);try{localStorage.setItem('market-watch-selected',JSON.stringify([...chosen]))}catch{}render()};label.append(input,span);area.append(label)}}
function add(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=text;return n}function stat(title,value){const n=add('div','stat','');n.append(add('span','small',title),add('strong','',value));return n}
function render(){const root=$('cards');root.replaceChildren();for(const [sym,name] of catalog){if(!chosen.has(sym))continue;const x=(latest?.items||[]).find(i=>i.symbol===sym)||{};const stock=add('section','stock',''),title=add('h2','stock-title',name),code=add('span','',sym);title.append(code);const grid=add('div','layout',''),left=add('div','box',''),right=add('div','box',''),price=add('div','price',money(x.current_price)+' '),unit=add('small','','USD');price.append(unit);left.append(add('div','small',(x.phase&&x.phase!=='休市'?x.phase:'最近')+'成交价'),price,add('div','small',x.quote_fresh?'行情时间 '+time(x.quote_time_bj)+' · 北京':'暂无有效行情'));const stats=add('div','stats','');stats.append(stat('昨收',money(x.previous_close)),stat('采样高',money(x.sample_high)),stat('采样低',money(x.sample_low)));left.append(stats);const direction=x.quote_fresh?x.direction_sample:null;const previous=latest?.fresh?x.previous_direction_sample:null;right.append(add('div','small','当前判断'),add('div','signal',direction?direction.direction+' · 强度 '+direction.strength:'观望'),add('div','trend',direction?'首次同向 '+time(direction.first_time_bj)+' · $'+money(direction.first_price):previous?'前次'+previous.direction+' '+time(previous.first_time_bj)+' · $'+money(previous.first_price):'趋势未确认'),add('div','note',direction?(previous?'前次'+previous.direction+' '+time(previous.first_time_bj)+' · $'+money(previous.first_price)+'；强度不代表胜率。':'采样趋势强度，仅供观察；不是胜率或交易指令。'):previous?'当前未确认方向；不代表持仓必须退出。':x.quote_fresh?'数据不足或走势震荡，等待下一次分析。':'等待有效行情。'));grid.append(left,right);stock.append(title,grid);root.append(stock)}if(!chosen.size)root.textContent='请选择要关注的股票。'}
async function load(){try{const res=await fetch('/api/market?_='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error();latest=await res.json();$('status').textContent=latest.fresh?'已更新':'等待更新';$('updated').textContent='最近分析：'+time(latest.generated_bj)+' · 北京时间。采样缺少可靠成交量，暂不提供止损或交易指令。';render()}catch{$('status').textContent='连接失败';$('updated').textContent='无法连接看板服务。'}}drawChoices();render();$('refresh').onclick=load;load();setInterval(load,15000);
</script></body></html>
