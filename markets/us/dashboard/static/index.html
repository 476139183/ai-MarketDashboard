<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>美股信号看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=8" />
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <p class="brand-name">美股信号看板</p>
        <p id="bj-clock" class="brand-sub clock-live">北京 —</p>
      </div>
      <div class="actions">
        <input id="symbols" type="text" value="SNDK,MU,NVDA" spellcheck="false" aria-label="标的" />
        <label class="field-label" for="bar-interval">K线</label>
        <select id="bar-interval" aria-label="K线周期">
          <option value="1m">1分钟</option>
          <option value="5m">5分钟</option>
          <option value="15m" selected>15分钟</option>
        </select>
        <button id="btn-timer" type="button" class="btn-timer" aria-pressed="false" title="按美东开盘09:30对齐K线收盘刷新">定时</button>
        <button id="btn-refresh" type="button">刷新</button>
      </div>
    </header>

    <p id="timer-status" class="timer-status"></p>
    <main id="cards" class="cards" aria-live="polite"></main>
  </div>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
